[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lid0501"
version = "0.5.1"
description = "LID0501 - Free B2B Lead Discovery and Qualification Engine for Ikaiva Studio"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ikaiva Studio Engineering" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.11",
    "openpyxl>=3.1.2",
]

[project.scripts]
lid = "lid.cli:app"

[tool.pytest.ini_options]
testpaths = ["lid/tests"]
python_files = ["test_*.py"]
